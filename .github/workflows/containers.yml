name: Containers

# The jobs that start database and cloud-emulator containers: the MySQL and PostgreSQL labs, and the AWS, Google Cloud
# and Azure emulators. They run on every push and pull request (this repository is public, so runner minutes are free),
# and a single suite can be run on its own with `gh workflow run containers.yml -f suite=gcp`. `make check-containers`
# runs the same suites locally. No cloud account is involved anywhere here.
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      suite:
        description: Which container suite to run
        type: choice
        default: all
        options: [all, mysql, postgres, aws, gcp, azure]

concurrency:
  group: containers-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mysql-sandbox:
    name: Engine-matched sandbox (MySQL 8.0)
    if: github.event_name != 'workflow_dispatch' || contains(fromJSON('["all", "mysql"]'), inputs.suite)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-only-password
          MYSQL_DATABASE: capacitylab_sandbox
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-only-password --silent"
          --health-interval=5s --health-timeout=3s --health-retries=40
    env:
      CAPACITYLAB_TEST_MYSQL: "1"
      CAPACITYLAB_MYSQL_HOST: 127.0.0.1
      CAPACITYLAB_MYSQL_PORT: "3307"
      CAPACITYLAB_MYSQL_USER: root
      CAPACITYLAB_MYSQL_PASSWORD: ci-only-password
      CAPACITYLAB_MYSQL_DATABASE: capacitylab_sandbox
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[dev,mysql]"
      # Percona tests join the lab container's network namespace, which a GitHub service container name does not
      # provide; they skip here unless a container named capacitylab-* is present.
      - name: MySQL sandbox and lab tests
        run: pytest -m mysql tests/test_mysql_sandbox.py tests/test_lab_mysql.py
      - name: The lab run and review from docs/LAB.md, as written
        run: |
          capacitylab lab run campaign-overlap --duration 60 --qps 300 --out runs/lab/campaign.yaml
          capacitylab run campaign-overlap --evidence runs/lab/campaign.yaml --sandbox mysql --quiet

  postgres-lab:
    name: PostgreSQL 17 lab
    if: github.event_name != 'workflow_dispatch' || contains(fromJSON('["all", "postgres"]'), inputs.suite)
    runs-on: ubuntu-latest
    env:
      CAPACITYLAB_TEST_POSTGRES: "1"
      CAPACITYLAB_POSTGRES_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      # Started with docker run rather than as a service: pg_stat_statements must be preloaded at server start.
      - name: Start PostgreSQL
        run: |
          docker run -d --name capacitylab-sandbox-postgres -p 127.0.0.1:5433:5432 \
            -e POSTGRES_PASSWORD=ci-only-password -e POSTGRES_DB=capacitylab_sandbox postgres:17-alpine \
            postgres -c shared_preload_libraries=pg_stat_statements -c pg_stat_statements.track=all
          for i in $(seq 1 40); do docker exec capacitylab-sandbox-postgres pg_isready -U postgres && break; sleep 2; done
      - name: Install
        run: pip install -e ".[dev,postgres]"
      - name: PostgreSQL lab tests
        run: pytest -m postgres tests/test_postgres_lab.py
      - name: The PostgreSQL lab run from docs/LAB.md, as written
        run: capacitylab lab run campaign-overlap --engine postgres --repeats 3 --out runs/lab/campaign-pg.yaml

  aws-import:
    name: AWS import (Floci emulator)
    if: github.event_name != 'workflow_dispatch' || contains(fromJSON('["all", "aws"]'), inputs.suite)
    runs-on: ubuntu-latest
    env:
      CAPACITYLAB_TEST_FLOCI: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Start Floci
        run: |
          docker run -d --name capacitylab-floci -p 127.0.0.1:4566:4566 \
            -v /var/run/docker.sock:/var/run/docker.sock floci/floci:2.1.0
          for i in $(seq 1 60); do docker logs capacitylab-floci 2>&1 | grep -q "Ready" && break; sleep 2; done
      - name: Install
        run: pip install -e ".[dev,aws]"
      - name: Seed the emulator
        run: python scripts/floci_seed.py
      - name: AWS import tests
        run: pytest -m aws tests/test_aws_import.py
      - name: The import from docs/IMPORTS.md, as written, then a review that cites it
        run: |
          capacitylab import aws --instance demo-writer --label "floci demo" --out runs/imports/aws.yaml
          capacitylab run campaign-overlap --evidence runs/imports/aws.yaml --out runs/ci-aws-run.json --quiet
      - name: Keep the imported evidence
        uses: actions/upload-artifact@v7
        with:
          name: floci-import
          path: runs/imports/aws.yaml
          retention-days: 14
      - name: Floci logs on failure
        if: failure()
        run: docker logs capacitylab-floci 2>&1 | tail -80

  gcp-import:
    name: GCP import (floci-gcp emulator)
    if: github.event_name != 'workflow_dispatch' || contains(fromJSON('["all", "gcp"]'), inputs.suite)
    runs-on: ubuntu-latest
    env:
      CAPACITYLAB_TEST_FLOCI_GCP: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Start floci-gcp
        run: |
          docker run -d --name capacitylab-floci-gcp -p 127.0.0.1:4588:4588 \
            -v /var/run/docker.sock:/var/run/docker.sock floci/floci-gcp:0.9.0
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:4588/health > /dev/null && break; sleep 2; done
      - name: Install
        run: pip install -e ".[dev]"
      - name: Seed the emulator
        run: python scripts/cloud_emulator_seed.py gcp
      - name: GCP import tests
        run: pytest -m gcp tests/test_gcp_azure_import.py
      - name: The import from docs/IMPORTS.md, as written, then a review that cites it
        run: |
          capacitylab import gcp --project floci-local --instance demo-pg --label "floci-gcp demo" --out runs/imports/gcp.yaml
          capacitylab run campaign-overlap --evidence runs/imports/gcp.yaml --out runs/ci-gcp-run.json --quiet
      - name: Keep the imported evidence
        uses: actions/upload-artifact@v7
        with:
          name: floci-gcp-import
          path: runs/imports/gcp.yaml
          retention-days: 14
      - name: floci-gcp logs on failure
        if: failure()
        run: docker logs capacitylab-floci-gcp 2>&1 | grep -v health | tail -80

  azure-import:
    name: Azure import (floci-az emulator)
    if: github.event_name != 'workflow_dispatch' || contains(fromJSON('["all", "azure"]'), inputs.suite)
    runs-on: ubuntu-latest
    env:
      CAPACITYLAB_TEST_FLOCI_AZ: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Start floci-az
        # A user-defined network: floci-az reaches the database containers it starts by container name, which the
        # default bridge network does not resolve.
        run: |
          docker network create floci
          docker run -d --name capacitylab-floci-az --network floci -p 127.0.0.1:4577:4577 \
            -v /var/run/docker.sock:/var/run/docker.sock floci/floci-az:0.13.0
          for i in $(seq 1 60); do docker logs capacitylab-floci-az 2>&1 | grep -q "Listening on" && break; sleep 2; done
      - name: Install
        run: pip install -e ".[dev]"
      - name: Seed the emulator
        run: python scripts/cloud_emulator_seed.py azure
      - name: Azure import tests
        run: pytest -m azure tests/test_gcp_azure_import.py
      - name: The import from docs/IMPORTS.md, as written, then a review that cites it
        run: |
          capacitylab import azure --subscription demo-subscription --resource-group capacitylab-demo \
            --instance demo-mysql --label "floci-az demo" --out runs/imports/azure.yaml
          capacitylab run campaign-overlap --evidence runs/imports/azure.yaml --out runs/ci-azure-run.json --quiet
      - name: Keep the imported evidence
        uses: actions/upload-artifact@v7
        with:
          name: floci-az-import
          path: runs/imports/azure.yaml
          retention-days: 14
      - name: floci-az logs on failure
        if: failure()
        run: docker logs capacitylab-floci-az 2>&1 | grep -v -e health -e Dispatching | tail -80
