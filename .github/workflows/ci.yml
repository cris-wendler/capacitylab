name: CI

# Lint, the test suite, and the README quickstart as written, on every push and pull request. The jobs that start
# database and cloud-emulator containers take longer to start, so they live in containers.yml and run there.
on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev,anthropic,openai,mysql,aws]"
      - name: Lint
        run: ruff check src tests scripts
      - name: Tests (scripted agents, SQLite sandbox; includes every command named in the README)
        run: pytest
      - name: Second scenario and the identifier scan
        run: |
          capacitylab run downsize-reader --out runs/ci-downsize.json --quiet
          capacitylab replay runs/ci-downsize.json
          capacitylab scan

  quickstart:
    name: README quickstart, as written
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the quickstart clones this checkout
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Run the quickstart block from README.md in an empty directory, with no environment variables set
        run: |
          awk '/<!-- quickstart:start -->/{f=1;next} /<!-- quickstart:end -->/{f=0} f && !/^```/' README.md > "$RUNNER_TEMP/quickstart.sh"
          # Clone this commit instead of the published main branch, so a pull request tests its own README.
          sed -i "s#git clone https://github.com/cris-wendler/capacitylab.git#git clone $GITHUB_WORKSPACE capacitylab#" "$RUNNER_TEMP/quickstart.sh"
          cat "$RUNNER_TEMP/quickstart.sh"
          mkdir "$RUNNER_TEMP/empty" && cd "$RUNNER_TEMP/empty"
          env -i HOME="$HOME" PATH="$PATH" bash -euxo pipefail "$RUNNER_TEMP/quickstart.sh"
          test -s capacitylab/runs/demo.json
