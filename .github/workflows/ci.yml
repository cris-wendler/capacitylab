name: CI

# The cheap checks: lint, the test suite and the mock demo, on every change. Runs once per change (a push to a branch
# is covered by its pull request), cancels a superseded run, and skips documentation-only changes. The jobs that start
# database and cloud-emulator containers cost several times as much, so they live in containers.yml and run on request.
on:
  push:
    branches: [main]  # feature branches are covered by their pull request; running both doubles the minutes
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE*"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE*"

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev,anthropic,openai,mysql,aws]"
      - name: Lint
        run: ruff check src tests scripts
      - name: Unit, integration, and end-to-end tests (mock provider, SQLite sandbox)
        run: pytest
      - name: Demo run, replay verification, and reference scan
        run: |
          capacitylab run campaign-overlap --provider mock --out runs/ci-campaign.json --quiet
          capacitylab replay runs/ci-campaign.json
          capacitylab run downsize-reader --provider mock --out runs/ci-downsize.json --quiet
          capacitylab scan
