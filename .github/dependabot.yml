# Monthly, and grouped: a stream of one-PR-per-bump would start a CI run each time. One PR per ecosystem, once a
# month, keeps dependency updates visible without spending the Actions budget on them.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule: {interval: monthly}
    open-pull-requests-limit: 1
    groups:
      python-dependencies:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: monthly}
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns: ["*"]
