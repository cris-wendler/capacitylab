# Isolated, disposable MySQL 8.0 sandbox for CapacityLab experiments.
# Bound to localhost only; data lives in tmpfs and disappears when the container stops.
# A local MySQL benchmark is NOT evidence of equivalent Aurora performance.
name: capacitylab
services:
  sandbox-mysql:
    image: mysql:8.0
    container_name: capacitylab-sandbox-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${CAPACITYLAB_MYSQL_PASSWORD:-change-me-local-only}
      MYSQL_DATABASE: capacitylab_sandbox
    ports:
      - "127.0.0.1:3307:3306"
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 40

  # Isolated, disposable PostgreSQL 17 sandbox with pg_stat_statements. Same rules: localhost only, tmpfs data.
  sandbox-postgres:
    image: postgres:17-alpine
    container_name: capacitylab-sandbox-postgres
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "pg_stat_statements.track=all",
              "-c", "track_io_timing=on"]
    environment:
      POSTGRES_PASSWORD: ${CAPACITYLAB_POSTGRES_PASSWORD:-change-me-local-only}
      POSTGRES_DB: capacitylab_sandbox
    ports:
      - "127.0.0.1:5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d capacitylab_sandbox"]
      interval: 3s
      timeout: 3s
      retries: 40

  # Local AWS emulator (Floci, MIT) for `capacitylab import aws`. Only started with: docker compose --profile aws up -d floci
  # It needs the Docker socket because it runs RDS instances as real database containers, which gives it control of
  # the local Docker daemon. Bound to localhost; nothing here reaches a real AWS account.
  floci:
    image: floci/floci:2.1.0
    container_name: capacitylab-floci
    profiles: [aws]
    ports:
      - "127.0.0.1:4566:4566"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
