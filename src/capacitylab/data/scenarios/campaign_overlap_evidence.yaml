      instance_class_modifications: 0
      failover_tests: 0
      measured_failover_seconds: null

  - id: EV-RATE-001
    kind: rate_card
    title: Illustrative rate card
    provenance: assumption
    source: fixture:rate_card
    data:
      currency: USD
      instance_hourly: {db.r6i.large: 0.29, db.r6i.xlarge: 0.58, db.r6i.2xlarge: 1.16, db.r6i.4xlarge: 2.32, db.r6i.8xlarge: 4.64, db.r6i.12xlarge: 6.96, db.r6i.16xlarge: 9.28, db.r6i.24xlarge: 13.92, db.r6i.32xlarge: 18.56}
