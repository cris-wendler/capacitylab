<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-labelledby="t d">
  <title id="t">CapacityLab</title>
  <desc id="d">CapacityLab 0.1.0. Five agents (database engineer, application owner, reliability engineer, FinOps analyst, tenant representative) review a database capacity decision around shared evidence, and every number they quote is checked. The demo runs offline with one command and no API key.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101a33"/>
      <stop offset="1" stop-color="#1d1a3a"/>
    </linearGradient>
    <linearGradient id="lgGlass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6ea8ff"/>
      <stop offset="1" stop-color="#9b7bff"/>
    </linearGradient>
    <linearGradient id="lgLiquid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4fd1a1"/>
      <stop offset="1" stop-color="#1b9b6d"/>
    </linearGradient>
    <clipPath id="lgInside"><path d="M26 8h12v16l14 24a6 6 0 0 1-5.2 9H17.2a6 6 0 0 1-5.2-9l14-24z"/></clipPath>
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.03"/>
    </radialGradient>
    <style>
      .title { font: 700 44px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #ffffff; }
      .sub { font: 400 17px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #c3cde3; }
      .q { font: 600 16px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #ffd27a; opacity: 0; }
      .chip { font: 600 12px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #e8ecf6; }
      .role { font: 600 12.5px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #ffffff; text-anchor: middle; }
      .core-t { font: 700 13px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #ffffff; text-anchor: middle; }
      .core-s { font: 400 10.5px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #c3cde3; text-anchor: middle; }
      .link { stroke-width: 2; stroke-dasharray: 4 7; fill: none; opacity: 0.55; animation: flow 1.6s linear infinite; }
      .glow { opacity: 0.18; animation: turn 10s ease-in-out infinite; }
      .ring { fill: none; stroke: #ffffff; stroke-width: 1.5; transform-origin: 690px 150px; animation: pulse 2.5s ease-out infinite; }
      .q1, .q2, .q3, .q4, .q5, .q6 { animation: rotate 18s infinite; }
      .q2 { animation-delay: 3s; } .q3 { animation-delay: 6s; } .q4 { animation-delay: 9s; }
      .q5 { animation-delay: 12s; } .q6 { animation-delay: 15s; }
      .caret { fill: #ffd27a; animation: blink 1s steps(1) infinite; }
      .ver { font: 700 12px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #0b1328; text-anchor: middle; }
      .cmd { font: 600 14px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #e8ecf6; }
      .prompt { fill: #4fd1a1; }
      .note { font: 400 11.5px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #8f9bb8; }
      .cursor { fill: #4fd1a1; animation: blink 1s steps(1) infinite; }
      .bubble { animation: rise 3.2s ease-in infinite; }
      .bubble2 { animation-delay: 1.6s; }
      .spark { transform-origin: 47px 18px; animation: twinkle 2.4s ease-in-out infinite; }
      @keyframes rise { 0% { transform: translateY(6px); opacity: 0; } 20% { opacity: 1; } 100% { transform: translateY(-14px); opacity: 0; } }
      @keyframes twinkle { 0%, 100% { transform: scale(.7); opacity: .6; } 50% { transform: scale(1.1); opacity: 1; } }
      .r2 { animation-delay: 2s; } .r3 { animation-delay: 4s; } .r4 { animation-delay: 6s; } .r5 { animation-delay: 8s; }
      @keyframes flow { to { stroke-dashoffset: -22; } }
      @keyframes turn { 0%, 22%, 100% { opacity: 0.18; } 6%, 16% { opacity: 1; } }
      @keyframes pulse { 0% { transform: scale(1); opacity: 0.55; } 100% { transform: scale(1.7); opacity: 0; } }
      @keyframes rotate { 0% { opacity: 0; } 2%, 15% { opacity: 1; } 17%, 100% { opacity: 0; } }
      @keyframes blink { 50% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) {
        .link, .glow, .ring, .caret, .cursor, .bubble, .spark { animation: none; }
        .q1 { animation: none; opacity: 1; }
      }
    </style>
  </defs>

  <rect width="900" height="300" rx="18" fill="url(#bg)"/>

  <!-- left: name, what it is, the questions it answers -->
  <g transform="translate(40 34) scale(0.86)">
    <rect width="64" height="64" rx="16" fill="#0b1328" stroke="#ffffff" stroke-opacity="0.12"/>
    <g clip-path="url(#lgInside)">
      <path d="M8 38c8-3 14 3 24 0s16-3 24 0v22H8z" fill="url(#lgLiquid)"/>
      <rect x="22" y="46" width="4.5" height="8" rx="1.2" fill="#ffffff" opacity=".9"/>
      <rect x="29.75" y="42" width="4.5" height="12" rx="1.2" fill="#ffffff" opacity=".9"/>
      <rect x="37.5" y="44" width="4.5" height="10" rx="1.2" fill="#ffd27a"/>
    </g>
    <path d="M26 8h12v16l14 24a6 6 0 0 1-5.2 9H17.2a6 6 0 0 1-5.2-9l14-24z" fill="none" stroke="url(#lgGlass)" stroke-width="3" stroke-linejoin="round"/>
    <path d="M23 8h18" stroke="url(#lgGlass)" stroke-width="3" stroke-linecap="round"/>
    <circle class="bubble" cx="30" cy="34" r="2" fill="#6ea8ff"/>
    <circle class="bubble bubble2" cx="35" cy="30" r="1.4" fill="#9b7bff"/>
    <path class="spark" d="M47 14l1.2 2.8L51 18l-2.8 1.2L47 22l-1.2-2.8L43 18l2.8-1.2z" fill="#ffd27a"/>
  </g>
  <text x="104" y="78" class="title">CapacityLab</text>
  <rect x="384" y="54" width="58" height="24" rx="12" fill="#ffd27a"/><text x="413" y="70.5" class="ver">v0.1.0</text>
  <text x="42" y="110" class="sub">Five agents review a database capacity decision.</text>
  <text x="42" y="132" class="sub">Every number they quote is checked against the evidence.</text>

  <text x="42" y="170" class="q caret" style="opacity:1">&#8250;</text>
  <text x="60" y="170" class="q q1">Add capacity for the flash sale?</text>
  <text x="60" y="170" class="q q2">Downsize an oversized reader?</text>
  <text x="60" y="170" class="q q3">Add an index instead of hardware?</text>
  <text x="60" y="170" class="q q4">Move the batch job out of the peak?</text>
  <text x="60" y="170" class="q q5">Is failover ready for the change?</text>
  <text x="60" y="170" class="q q6">Who pays for the tenant's burst?</text>

  <g transform="translate(42 190)">
    <rect width="92" height="26" rx="13" fill="#d97757"/><text x="46" y="17.5" class="chip" text-anchor="middle">LLM agents</text>
    <rect x="100" width="118" height="26" rx="13" fill="#3a4a7a"/><text x="159" y="17.5" class="chip" text-anchor="middle">queueing model</text>
    <rect x="226" width="92" height="26" rx="13" fill="#2f6b58"/><text x="272" y="17.5" class="chip" text-anchor="middle">cost model</text>
    <rect x="326" width="172" height="26" rx="13" fill="#2b5c8a"/><text x="412" y="17.5" class="chip" text-anchor="middle">MySQL + PostgreSQL lab</text>
  </g>

  <!-- the quickstart, as one command -->
  <g transform="translate(42 232)">
    <rect width="498" height="36" rx="9" fill="#0b1328" stroke="#ffffff" stroke-opacity="0.14"/>
    <text x="14" y="23" class="cmd"><tspan class="prompt">$</tspan> capacitylab run campaign-overlap</text>
    <rect x="304" y="10" width="8" height="16" class="cursor"/>
    <text x="486" y="22.5" class="note" text-anchor="end">offline, no API key</text>
  </g>

  <!-- right: five agents around shared evidence -->
  <path class="link" stroke="#6ea8ff" d="M690 57 L690 112"/>
  <path class="link" stroke="#ffc24d" d="M781 120 L726 138"/>
  <path class="link" stroke="#f0967a" d="M745 225 L712 181"/>
  <path class="link" stroke="#b69cff" d="M635 225 L668 181"/>
  <path class="link" stroke="#4fd1a1" d="M599 120 L654 138"/>

  <circle cx="690" cy="150" r="38" class="ring"/>
  <circle cx="690" cy="150" r="38" fill="url(#core)" stroke="#ffffff" stroke-opacity="0.5" stroke-width="1.5"/>
  <text x="690" y="148" class="core-t">evidence</text>
  <text x="690" y="163" class="core-s">cited, checked</text>

  <g>
    <rect x="626" y="27" width="128" height="30" rx="15" fill="#2d6cdf" class="glow"/>
    <rect x="626" y="27" width="128" height="30" rx="15" fill="none" stroke="#6ea8ff" stroke-width="1.5"/>
    <text x="690" y="46.5" class="role">Database engineer</text>
  </g>
  <g>
    <rect x="733" y="101" width="120" height="30" rx="15" fill="#c98a00" class="glow r2"/>
    <rect x="733" y="101" width="120" height="30" rx="15" fill="none" stroke="#ffc24d" stroke-width="1.5"/>
    <text x="793" y="120.5" class="role">Reliability (SRE)</text>
  </g>
  <g>
    <rect x="699" y="225" width="112" height="30" rx="15" fill="#c75b3b" class="glow r3"/>
    <rect x="699" y="225" width="112" height="30" rx="15" fill="none" stroke="#f0967a" stroke-width="1.5"/>
    <text x="755" y="244.5" class="role">FinOps analyst</text>
  </g>
  <g>
    <rect x="566" y="225" width="120" height="30" rx="15" fill="#7a5ad6" class="glow r4"/>
    <rect x="566" y="225" width="120" height="30" rx="15" fill="none" stroke="#b69cff" stroke-width="1.5"/>
    <text x="626" y="244.5" class="role">Tenant rep</text>
  </g>
  <g>
    <rect x="527" y="101" width="126" height="30" rx="15" fill="#1b9b6d" class="glow r5"/>
    <rect x="527" y="101" width="126" height="30" rx="15" fill="none" stroke="#4fd1a1" stroke-width="1.5"/>
    <text x="590" y="120.5" class="role">Application owner</text>
  </g>

  <text x="690" y="286" class="core-s">each turn cites evidence, and the review itself is scored</text>
</svg>
