<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 270" width="900" height="270" role="img" aria-labelledby="t d">
  <title id="t">Checks on every agent turn</title>
  <desc id="d">An illustrative FinOps analyst turn from an LLM agent goes through four checks. Citations exist and are visible to the role, requested checks are allowed, and spend is within limits. One claim quotes $16.80, which is not in the rate card it cites, so it is flagged in the decision record.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101a33"/>
      <stop offset="1" stop-color="#1d1a3a"/>
    </linearGradient>
    <style>
      .h { font: 700 17px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #ffffff; }
      .hs { font: 400 12.5px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #aab6d1; }
      .k { font: 600 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #8f9bb8; }
      .v { font: 500 12.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #e8ecf6; }
      .id { font: 600 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #6ea8ff; }
      .row { font: 600 13.5px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #ffffff; }
      .note { font: 400 11.5px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #aab6d1; }
      .chip { font: 700 11px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #ffffff; text-anchor: middle; }
      .mark { stroke: #ffffff; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .hit { opacity: 0; animation: hit 9s ease-out infinite; }
      .d1 { animation-delay: 0.6s; } .d2 { animation-delay: 1.6s; } .d3 { animation-delay: 2.6s; } .d4 { animation-delay: 3.6s; }
      .d5 { animation-delay: 4.6s; }
      @keyframes hit { 0% { opacity: 0; } 3% { opacity: 1; } 80% { opacity: 1; } 88%, 100% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .hit { animation: none; opacity: 1; } }
    </style>
  </defs>

  <rect width="900" height="270" rx="18" fill="url(#bg)"/>

  <!-- the turn, as the model returned it -->
  <rect x="24" y="24" width="408" height="222" rx="12" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.15"/>
  <rect x="40" y="40" width="112" height="24" rx="12" fill="#c75b3b"/>
  <text x="96" y="56" class="chip">FinOps analyst</text>
  <text x="162" y="56" class="hs">round 2 · LLM agent · example</text>

  <text x="40" y="92" class="k">POSITION</text>
  <text x="40" y="110" class="v">index and move the batch job</text>

  <text x="40" y="138" class="k">CLAIM</text>
  <text x="40" y="156" class="v">Alder's last sale peaked at 3.1x</text>
  <text x="416" y="156" class="id" text-anchor="end">EV-TEN-ALDER-001</text>

  <rect x="34" y="166" width="390" height="44" rx="8" fill="#e5484d" fill-opacity="0.16" stroke="#ff8a8f" stroke-opacity="0.8" class="hit d2"/>
  <text x="40" y="182" class="k">CLAIM</text>
  <text x="40" y="200" class="v">Scaling up costs $16.80 for the evening</text>
  <text x="416" y="200" class="id" text-anchor="end">EV-RATE-001</text>

  <text x="40" y="232" class="k">ASKS FOR</text>
  <text x="112" y="232" class="v">capacity_forecast, cost</text>

  <!-- the checks CapacityLab runs on it -->
  <text x="460" y="48" class="h">Checked by code, not by the model</text>
  <text x="460" y="68" class="hs">Runs after every turn, from scripted agents or the LLM.</text>

  <g transform="translate(460 92)">
    <circle cx="13" cy="13" r="13" fill="#ffffff" fill-opacity="0.08"/>
    <g class="hit d1"><circle cx="13" cy="13" r="13" fill="#1baf7a"/><path class="mark" d="M7 13.5 L11.5 18 L19.5 8.5"/></g>
    <text x="38" y="12" class="row">Cited evidence exists, and this role may see it</text>
    <text x="38" y="28" class="note">EV-TEN-ALDER-001, EV-RATE-001</text>
  </g>
  <g transform="translate(460 136)">
    <circle cx="13" cy="13" r="13" fill="#ffffff" fill-opacity="0.08"/>
    <g class="hit d2"><circle cx="13" cy="13" r="13" fill="#e5484d"/><path class="mark" d="M8.5 8.5 L17.5 17.5 M17.5 8.5 L8.5 17.5"/></g>
    <text x="38" y="12" class="row">Every number appears in the evidence it cites</text>
    <text x="38" y="28" class="note">16.80 is not in EV-RATE-001: flagged in the record</text>
  </g>
  <g transform="translate(460 180)">
    <circle cx="13" cy="13" r="13" fill="#ffffff" fill-opacity="0.08"/>
    <g class="hit d3"><circle cx="13" cy="13" r="13" fill="#1baf7a"/><path class="mark" d="M7 13.5 L11.5 18 L19.5 8.5"/></g>
    <text x="38" y="12" class="row">Requested checks are allowed for this role</text>
    <text x="38" y="28" class="note">the FinOps analyst may ask for a forecast and cost</text>
  </g>
  <g transform="translate(460 224)">
    <circle cx="13" cy="13" r="13" fill="#ffffff" fill-opacity="0.08"/>
    <g class="hit d4"><circle cx="13" cy="13" r="13" fill="#1baf7a"/><path class="mark" d="M7 13.5 L11.5 18 L19.5 8.5"/></g>
    <text x="38" y="12" class="row">Spend stays inside the run and total limits</text>
    <text x="38" y="28" class="note">worst case estimated before each model call</text>
  </g>
</svg>
