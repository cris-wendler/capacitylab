[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "capacitylab"
version = "0.1.3"
description = "Role-based review of database capacity, reliability, and cost decisions, grounded in measured evidence"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "AGPL-3.0-or-later"}
dependencies = [
  "pydantic==2.14.2",
  "PyYAML==6.0.3",
  "fastapi==0.162.0",
  "uvicorn==0.54.0",
  "jinja2==3.1.6",
  "python-multipart==0.0.32",
]

# Direct dependencies are pinned to the versions the test suite passes with. Dependabot proposes updates.
[project.optional-dependencies]
anthropic = ["anthropic==2.3.0"]
openai = ["openai==3.41.0"]
mysql = ["pymysql==1.2.3"]
aws = ["boto3==1.43.122"]
gcp = ["google-auth[requests]==2.62.0"]
azure = ["azure-identity==1.27.0"]
postgres = ["psycopg[binary]==3.3.6"]
dev = ["pytest==9.2.0", "httpx==0.28.1", "ruff==0.17.3"]
all = ["capacitylab[anthropic,openai,mysql,postgres,aws,gcp,azure]"]  # every optional dependency, for the full test suite
media = ["playwright==1.64.1", "pillow==13.0.0"]

[project.scripts]
capacitylab = "capacitylab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
capacitylab = ["data/**/*", "web/templates/*", "web/static/*", "simulation/prompts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # tests import shared helpers from tests.conftest, with plain `pytest` as in CI
addopts = "-m 'not live'"
markers = [
  "mysql: requires the local MySQL sandbox (docker compose up -d --wait sandbox-mysql)",
  "postgres: requires the local PostgreSQL sandbox (docker compose up -d --wait sandbox-postgres)",
  "aws: requires a seeded local AWS emulator (docker compose --profile aws up -d floci; python scripts/floci_seed.py)",
  "gcp: requires a seeded floci-gcp (docker compose --profile gcp up -d floci-gcp; python scripts/cloud_emulator_seed.py gcp)",
  "azure: requires a seeded floci-az (docker compose --profile azure up -d floci-az; python scripts/cloud_emulator_seed.py azure)",
  "live: calls a real model provider and spends money",
]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["capacitylab", "tests"]
